name: CI/CD

on:
  push:
    branches:
      - main
      - dev
      - "feature/**"
  pull_request:
    branches:
      - main
      - dev
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-build:
    name: Validate and build extension
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: tab-story/package-lock.json

      - name: Install extension dependencies
        run: npm ci --prefix tab-story --ignore-scripts

      - name: Lint
        run: npm run lint --prefix tab-story

      - name: Type-check
        run: npm run typecheck --prefix tab-story

      - name: Run deterministic checks
        run: npm run test:qa --prefix tab-story

      - name: Build extension
        run: npm run build --prefix tab-story
        env:
          NODE_ENV: production

      - name: Install test browser
        working-directory: tab-story
        run: npx playwright install --with-deps chromium

      - name: Unit tests
        run: npm run test:unit --prefix tab-story

      - name: Browser and upgrade tests
        run: xvfb-run -a npm run test:integration --prefix tab-story

      - name: Package extension
        working-directory: tab-story/dist
        run: zip -r "../../tab-story-${GITHUB_SHA}.zip" .

      - name: Upload extension package
        uses: actions/upload-artifact@v4
        with:
          name: tab-story-${{ github.sha }}
          path: tab-story-${{ github.sha }}.zip
          if-no-files-found: error
          retention-days: 30
