name: 🚀 Build & Deploy

on:
  push:
    branches: [main, dev]
    tags: ['v*']
  pull_request:
    branches: [main, dev]

jobs:
  build:
    name: Build Extension
    runs-on: ubuntu-latest
    permissions:
      contents: read
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
      
      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
      
      - name: 📦 Install dependencies
        run: npm ci --prefer-offline
      - name: Install extension dependencies
        run: npm ci --prefix tab-story --prefer-offline
      
      - name: ✅ Validate environment
        run: npm run env:validate
      
      - name: 🎨 Lint code
        run: npm run lint
      
      - name: 🧪 Run tests
        run: npm test
      
      - name: 🏗️ Build project
        run: npm run build
        env:
          NODE_ENV: production
      
      - name: 📦 Create distributable
        run: |
          mkdir -p releases
          if [ -d "tab-story/dist" ]; then
            zip -r releases/tab-story-${{ github.sha }}.zip tab-story/dist/
          fi
      
      - name: 📤 Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tab-story-build
          path: releases/
          retention-days: 30

  security-post-build:
    name: Post-Build Security Check
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
    
    steps:
      - name: 📥 Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: tab-story-build
      
      - name: 🔍 Verify no secrets in build
        run: |
          echo "🔍 Scanning build artifacts for secrets..."
          if unzip -l tab-story-*.zip | grep -iE "\.env|secret|\.key|password"; then
            echo "❌ Secrets found in build!"
            exit 1
          fi
          echo "✓ No secrets detected in build"

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: security-post-build
    permissions:
      contents: write
    if: startsWith(github.ref, 'refs/tags/')
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
      
      - name: 📥 Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: tab-story-build
      
      - name: 🏷️ Create Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref }}
          release_name: Release ${{ github.ref_name }}
          draft: false
          prerelease: ${{ contains(github.ref, '-') }}
      
      - name: 📤 Upload Release Asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./tab-story-*.zip
          asset_name: tab-story-${{ github.ref_name }}.zip
          asset_content_type: application/zip
