name: 🔐 Security Scan & Vulnerability Check

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    # Run daily at 2 AM UTC
    - cron: '0 2 * * *'

jobs:
  security-scan:
    name: Security Scanning
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
      
      - name: 📦 Install dependencies
        run: npm ci --prefer-offline
      
      - name: 🔍 Detect secrets
        run: bash scripts/detect-secrets.sh || true
      
      - name: ✅ Validate environment configuration
        run: npm run env:validate
      
      - name: 🔎 Check for dangerous patterns
        run: |
          echo "🔎 Checking for eval() and unsafe functions..."
          if grep -r "eval(" --include="*.js" --include="*.ts" --exclude-dir=node_modules --exclude-dir=dist . 2>/dev/null; then
            echo "❌ eval() found in code"
            exit 1
          fi
          echo "✓ No eval() detected"
          
          echo "🔎 Checking for innerHTML without sanitization..."
          if grep -r "innerHTML\s*=" --include="*.js" --include="*.ts" --exclude-dir=node_modules --exclude-dir=dist . 2>/dev/null | grep -v "textContent" | head -5; then
            echo "⚠️  innerHTML found (ensure content is sanitized)"
          fi
      
      - name: 🔒 Check Content Security Policy
        run: |
          echo "✓ Checking CSP configuration..."
          node -e "const csp = require('./config/csp.json'); console.log('CSP Profiles:', Object.keys(csp)); if(!csp.production) { console.error('❌ Missing production CSP'); process.exit(1); }"
      
      - name: 📋 Check manifest.json security
        run: |
          echo "✓ Validating manifest.json..."
          node -e "
          const manifest = require('./manifest.json');
          const checks = [
            manifest.content_security_policy && manifest.content_security_policy.extension_pages,
            manifest.manifest_version === 3,
            Array.isArray(manifest.permissions),
            manifest.background && manifest.background.service_worker
          ];
          if (checks.some(c => !c)) {
            console.error('❌ Manifest security issues detected');
            process.exit(1);
          }
          console.log('✓ Manifest security checks passed');
          "

  dependency-audit:
    name: Dependency Vulnerability Audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
      
      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
      
      - name: 📦 Install dependencies
        run: npm ci --prefer-offline
      
      - name: 🔍 Run npm audit
        run: npm audit --audit-level=moderate
        continue-on-error: false
      
      - name: 🔍 Check for outdated packages
        run: npm outdated || true

  code-quality:
    name: Code Quality & Linting
    runs-on: ubuntu-latest
    permissions:
      contents: read
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
      
      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
      
      - name: 📦 Install dependencies
        run: npm ci --prefer-offline
      
      - name: 🎨 Run ESLint
        run: npm run lint
      
      - name: ✅ Run tests
        run: npm test || true

  permissions-check:
    name: Extension Permissions Audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
      
      - name: 🔍 Check permissions
        run: |
          echo "📋 Current extension permissions:"
          node -e "
          const manifest = require('./manifest.json');
          console.log('Permissions:', manifest.permissions);
          console.log('Host Permissions:', manifest.host_permissions || []);
          
          const criticalPerms = ['tabs', 'storage', 'activeTab'];
          const hasAllCritical = criticalPerms.every(p => manifest.permissions.includes(p));
          
          if (!hasAllCritical) {
            console.warn('⚠️  Missing some critical permissions');
          }
          console.log('✓ Permission audit complete');
          "

  compliance-check:
    name: Security & Compliance Verification
    runs-on: ubuntu-latest
    permissions:
      contents: read
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
      
      - name: ✅ Verify SECURITY.md exists
        run: |
          if [ ! -f "SECURITY.md" ]; then
            echo "❌ SECURITY.md not found"
            exit 1
          fi
          echo "✓ SECURITY.md found"
      
      - name: ✅ Verify .gitignore protects secrets
        run: |
          echo "✓ Checking .gitignore..."
          if ! grep -q "\.env" .gitignore; then
            echo "❌ .env files not in .gitignore"
            exit 1
          fi
          if ! grep -q "\*\.key" .gitignore; then
            echo "❌ .key files not in .gitignore"
            exit 1
          fi
          echo "✓ .gitignore properly configured"

summary: |
  ✅ Security scanning complete
  - All secrets detection checks passed
  - Dependency audit completed
  - Code quality verified
  - Extension permissions verified
  - Compliance checks passed
