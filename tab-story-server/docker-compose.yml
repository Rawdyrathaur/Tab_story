services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tabstory}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-tabstory}
    # PostgreSQL is consumed by the API on the VM; never expose it publicly.
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["tab_story_pg:/var/lib/postgresql/data"]
volumes:
  tab_story_pg:
